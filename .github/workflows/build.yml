name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # ForgeGradle 2.1 needs Java 8.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      # 1) Pure-logic tests (no Minecraft needed): parser, confidence model, text offsets.
      - name: Logic tests
        run: |
          mkdir -p /tmp/t
          javac -encoding UTF-8 -d /tmp/t \
            src/main/java/com/chatheads/util/TextUtil.java \
            src/main/java/com/chatheads/chat/ChatMessageParser.java \
            src/main/java/com/chatheads/player/ConfidenceModel.java \
            src/main/java/com/chatheads/player/IdentityScorer.java \
            src/test/java/com/chatheads/LogicSmokeTest.java
          java -cp /tmp/t com.chatheads.LogicSmokeTest

      # 2) ForgeGradle 2.1 only works with Gradle 2.14.x, so download it instead of using setup-gradle.
      - name: Install Gradle 2.14.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-2.14.1-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-2.14.1/bin" >> "$GITHUB_PATH"

      - name: Cache Gradle / ForgeGradle downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: fg21-${{ hashFiles('build.gradle') }}

      # setupCIWorkspace = the CI-friendly FG 2.x task (no decompile, much faster than setupDecompWorkspace).
      - name: Build
        run: gradle setupCIWorkspace build --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ChatHeads-1.8.9
          path: build/libs/*.jar
